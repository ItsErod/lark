name: CI

on:
  pull_request:

# Lint and native tests for pull requests. Installer publishing stays in the
# Build workflow. Fork pull requests stay read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # GitHub's macOS and Windows images ship CMake 4, which rejects the
  # vendored Opus CMakeLists (cmake_minimum_required 3.1).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev cmake libssl-dev ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: cargo clippy
        # The workspace is not clean (about 90 warnings on main). Record the
        # count instead of denying warnings, so this job stays a signal
        # rather than a wall of existing lint.
        run: |
          cargo clippy --workspace --all-targets --message-format=short -- -W warnings 2>&1 | tee clippy.txt
          count=$({ grep -E ':[0-9]+:[0-9]+: warning:' clippy.txt || true; } | sed -E 's/: warning:.*//' | sort -u | wc -l | tr -d ' ')
          {
            echo "### cargo clippy"
            echo ""
            echo "${count} warning(s). The workspace is not clean, so this job records the count and does not deny warnings."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=cargo clippy::${count} warnings"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-warnings
          path: clippy.txt
          if-no-files-found: ignore

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: eslint
        run: npm run lint

  native-tests:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev cmake libssl-dev ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Native Rust tests
        run: cargo test --workspace
