name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "store/**"
      - "scripts/build-store.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Static dashboard only. The app build workflow stays on contents: read.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble the progress page and the store
        run: |
          rm -rf site
          mkdir -p site
          cp -a docs/. site/
          node scripts/build-store.mjs --publish site
          # One Pages artifact replaces the whole site. Keep /ui from the live
          # site so a docs or store deploy does not wipe interface bundles.
          node scripts/preserve-pages-ui.mjs site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
