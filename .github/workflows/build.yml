name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v2.1
        required: false
        default: ""

# Fork pull requests must not receive write access or repository secrets.
# Release notes and installer jobs opt into contents: write, and only on tags
# and manual runs. Pull requests keep the read-only default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GitHub's macOS and Windows images ship CMake 4, which rejects the
  # vendored Opus CMakeLists (cmake_minimum_required 3.1).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  release-notes:
    name: Release notes
    # Runs in parallel with tests. The installer job waits for both.
    # A notes failure falls back to the static installer blurb so the
    # build job still publishes.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      body: ${{ steps.notes.outputs.body || steps.fallback.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate release notes
        id: notes
        continue-on-error: true
        env:
          LARK_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-notes.mjs --github-output
      - name: Fall back to the installer blurb
        id: fallback
        if: steps.notes.outcome != 'success' || steps.notes.outputs.body == ''
        run: |
          delimiter="LARK_FALLBACK_$(uuidgen | tr -d '-')"
          {
            echo "body<<${delimiter}"
            echo "Unsigned installers for this tag."
            echo ""
            echo "- macOS: universal build (Apple Silicon and Intel), \`.dmg\`"
            echo "- Windows: \`.msi\` and \`.exe\`"
            echo ""
            echo "On first launch, macOS users should right-click the app and choose Open."
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
      - name: Prepend the notes to CHANGELOG.md
        if: steps.notes.outcome == 'success' && steps.notes.outputs.body != ''
        continue-on-error: true
        env:
          LARK_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "$LARK_TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'
          test -s /tmp/lark-release-notes.md
          git fetch origin main
          git worktree add --detach /tmp/lark-changelog origin/main
          node .github/scripts/release-notes.mjs --prepend /tmp/lark-changelog/CHANGELOG.md \
            --notes /tmp/lark-release-notes.md \
            --date "$(git log -1 --format=%cs "$LARK_TAG")"
          git -C /tmp/lark-changelog add CHANGELOG.md
          if git -C /tmp/lark-changelog diff --cached --quiet; then
            echo "CHANGELOG.md already includes ${LARK_TAG}"
            exit 0
          fi
          git -C /tmp/lark-changelog \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Add ${LARK_TAG} to the changelog."
          git -C /tmp/lark-changelog pull --rebase origin main
          git -C /tmp/lark-changelog push origin HEAD:main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium for the IRC layout test
        run: npx playwright install --with-deps chromium
      - name: Frontend tests
        run: npm test
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev cmake libssl-dev ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Core tests
        run: cargo test -p lark-core
      - name: Hardware encoder stub
        run: cargo test -p lark-clip-hw
      - name: Typecheck the desktop shell
        run: cargo check -p lark

  build:
    needs: [test, release-notes]
    # Installer builds are the expensive jobs (macOS minutes in particular).
    # Pull requests only run the test job. Publishing stays on version tags
    # and on a manual run, which only maintainers can start.
    # release-notes is skipped on those pull requests; a skipped notes job
    # must not skip this job when a tag or a manual run really is publishing.
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
      - name: Install WiX Toolset 3
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --no-progress -y
          $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wixBin) { throw "WiX Toolset v3 was not found" }
          $bin = Join-Path $wixBin.FullName "bin"
          if (-not (Test-Path (Join-Path $bin "candle.exe"))) { throw "candle.exe missing in $bin" }
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install frontend dependencies
        run: npm ci
      - name: Set the installer version from the tag
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        env:
          LARK_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: node .github/scripts/set-release-version.mjs
      - name: Build
        if: github.ref_type != 'tag' && (github.event_name != 'workflow_dispatch' || inputs.tag == '')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tauriScript: npx tauri
      - name: Build and attach installers to the release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tauriScript: npx tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseBody: ${{ needs.release-notes.outputs.body || 'Unsigned installers for this tag.' }}
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
