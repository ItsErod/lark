name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v2.1
        required: false
        default: ""

# Fork pull requests must not receive write access or repository secrets.
# The release job below opts into contents: write for tags and manual runs only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GitHub's macOS and Windows images ship CMake 4, which rejects the
  # vendored Opus CMakeLists (cmake_minimum_required 3.1).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium for the IRC layout test
        run: npx playwright install --with-deps chromium
      - name: Frontend tests
        run: npm test
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev cmake libssl-dev ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Core tests
        run: cargo test -p lark-core
      - name: Hardware encoder stub
        run: cargo test -p lark-clip-hw
      - name: Typecheck the desktop shell
        run: cargo check -p lark

  build:
    needs: test
    # Installer builds are the expensive jobs (macOS minutes in particular).
    # Pull requests only run the test job. Publishing stays on version tags
    # and on a manual run, which only maintainers can start.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
      - name: Install WiX Toolset 3
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --no-progress -y
          $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wixBin) { throw "WiX Toolset v3 was not found" }
          $bin = Join-Path $wixBin.FullName "bin"
          if (-not (Test-Path (Join-Path $bin "candle.exe"))) { throw "candle.exe missing in $bin" }
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install frontend dependencies
        run: npm ci
      - name: Set the installer version from the tag
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        env:
          LARK_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: node .github/scripts/set-release-version.mjs
      - name: Build
        if: github.ref_type != 'tag' && (github.event_name != 'workflow_dispatch' || inputs.tag == '')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tauriScript: npx tauri
      - name: Build and attach installers to the release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tauriScript: npx tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseBody: |
            Unsigned installers for this tag.

            - macOS: universal build (Apple Silicon and Intel), `.dmg`
            - Windows: `.msi` and `.exe`

            On first launch, macOS users should right-click the app and choose Open.
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
