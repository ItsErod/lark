name: Interface updates

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the canary interface bundle to stable
        type: boolean
        default: true

# Canary publishes a signed frontend zip when main changes the interface and
# not the native app. Stable receives that zip only through this manual
# promotion, or automatically when a v* tag is pushed. Bump minNative in
# interface.json when a bundle needs a newer app; older installs then keep the
# packaged UI and take the full updater instead.
#
# Pages deploys one artifact. This job rebuilds /progress and /store from the
# repo and merges the live /ui tree so neither is wiped.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide which channel to publish
        id: plan
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          LARK_PROMOTE: ${{ (github.event_name == 'workflow_dispatch' && inputs.promote) || startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/publish-ui-bundle.mjs --plan

  publish:
    needs: plan
    if: needs.plan.outputs.action != 'skip'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the interface
        if: needs.plan.outputs.action == 'canary'
        run: npm ci && npm run build
      - name: Stage the site without dropping progress or the store
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          LARK_PROMOTE: ${{ (github.event_name == 'workflow_dispatch' && inputs.promote) || startsWith(github.ref, 'refs/tags/v') }}
          LARK_UI_SIGNING_PRIVATE_KEY: ${{ secrets.LARK_UI_SIGNING_PRIVATE_KEY }}
        run: node scripts/publish-ui-bundle.mjs --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
