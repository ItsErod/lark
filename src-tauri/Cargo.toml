[package]
name = "lark"
version = "2.4.2"
edition = "2021"
description = "Lark, a small personal Discord client for macOS and Windows"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lark-core = { path = "../crates/lark-core" }
lark-clip-hw = { path = "../crates/lark-clip-hw" }
env_logger = "0.11"
log = "0.4"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"
base64 = "0.22"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = { version = "0.9.8", default-features = false }
# keyring 3 enables no stores by default. Without these features the macOS and
# Windows builds use an in-memory mock: set_password succeeds on one Entry, and
# the next Entry::new cannot see it. That is the "No token saved" toast.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
