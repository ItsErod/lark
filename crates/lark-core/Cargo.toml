[package]
name = "lark-core"
version = "2.3.0"
edition = "2021"
description = "Core logic for Lark, a small personal Discord client"
publish = false

[dependencies]
aes-gcm = "0.10"
# `static` compiles the bundled Opus sources when the system has no libopus.
audiopus_sys = { version = "0.2", features = ["static"] }
chacha20poly1305 = "0.10"
cpal = "0.15"
futures-util = "0.3"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
toml = "0.8"
urlencoding = "2"
xsalsa20poly1305 = "0.9"
zeroize = "1"
