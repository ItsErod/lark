[package]
name = "lark-core"
version = "3.0.0"
edition = "2021"
description = "Core logic for Lark, a small personal Discord client"
license = "MIT"
publish = false

[build-dependencies]
cc = "1"

[dependencies]
lark-clip-hw = { path = "../lark-clip-hw" }
aes-gcm = "0.10"
# `static` compiles the bundled Opus sources when the system has no libopus.
audiopus_sys = { version = "0.2", features = ["static"] }
chacha20poly1305 = "0.10"
cpal = "0.15"
dave = "0.3"
futures-util = "0.3"
base64 = "0.22"
jpeg-decoder = "0.3"
jpeg-encoder = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
toml = "0.8"
urlencoding = "2"
xsalsa20poly1305 = "0.9"
zeroize = "1"
nnnoiseless = "0.5.2"

[dev-dependencies]
openmls = { version = "0.9", features = ["js"] }
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
tls_codec = { version = "0.5", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
