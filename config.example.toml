# Lark config. The desktop app reloads this file when it changes.
# Saving from Settings rewrites the file and drops comments.
# Importing a theme writes that one file. Other theme files are left alone.
# The gallery and the file format are described in THEMES.md.

[appearance]
theme = "discord"              # see THEMES.md; modern-dark is the warm ink option
density = "cozy"               # cozy | compact | irc
font_family = "inter"          # inter | system | serif | mono
font_size = 16                 # clamped to 12–20
channel_list = "left"          # left | right | hidden
show_member_list = true
show_server_rail = true

# "mod" is Command on macOS and Ctrl on Windows. Both can be remapped.
[shortcuts]
quick_switcher = "mod+k"
open_settings = "mod+comma"
toggle_members = "mod+shift+m"
toggle_channels = "mod+b"
focus_composer = "mod+l"
next_unread = "alt+shift+down"
previous_channel = "alt+up"
next_channel = "alt+down"
edit_last = "arrowup"
toggle_mute = "mod+shift+alt+m"
toggle_deafen = "mod+shift+d"
push_to_talk = "backquote"
toggle_voice_overlay = "mod+shift+o"
# Same HUD window. Shows RAM, CPU, and FPS. Global on macOS and Windows.
toggle_perf_overlay = "mod+shift+p"
# Pause animations and channel prefetch, and slow the existing polls.
toggle_game_mode = "mod+shift+g"
# Global on macOS and Windows. Needs a modifier (or a function key). Writes a local clip; it does not upload.
save_clip = "mod+shift+c"

[notifications]
default = "all"                # all | mentions | mute
keywords = ["wordmark"]

# Example overrides. Replace the ids with a server or channel from your account.
[notifications.guilds.100000000000000011]
level = "mentions"

[notifications.channels.100000000000000025]
muted = true

[plugins]
# The pack in PLUGINS.md ships off. Turn a plugin on in Settings; Lark loads it then.
enabled = ["highlight-mentions", "code-badge"]

[voice]
mode = "vad"                   # vad | ptt
sensitivity = 45               # 0–100
noise_suppression = true       # RNNoise on the microphone. Echo cancellation stays off.
input_device = ""
output_device = ""
overlay = false                 # always-on-top speaking HUD; hotkey is toggle_voice_overlay
overlay_opacity = 70            # 35–100
overlay_click_through = true    # clicks pass through to the game

# Per-person playback. Volume is 0–200. muted is local and is not sent to Discord.
# [voice.levels.100000000000000002]
# volume = 80
# muted = false

[soundboard]
# WAV clips mixed into a voice channel. A hotkey with a modifier is global.
# [[soundboard.clips]]
# id = "horn"
# name = "Horn"
# path = ""
# hotkey = "mod+shift+1"
# volume = 100

[clips]
# Main-display buffer for the clip hotkey. Screen share turns the same buffer on.
# Both off discards it. Files stay in the clips folder until you attach one.
game_capture = false

[privacy]
# Hides emails, tokens, DM previews, and personal info. Off until you turn it on.
streamer = false
# Also turn it on while screen share or the clip buffer is recording.
streamer_auto = false

[desktop]
minimize_to_tray = true
autostart = false
# 0 matches the display. Otherwise a cap from 30 to 240. Never above 240.
frame_cap = 240
# Off until Settings → Lark turns it on. GPU, CPU temperature, and the current game.
hardware_status = false
# Performance strip in the voice HUD. Off until Settings or the hotkey.
perf_overlay = false
# Foreground game check so Game Mode can start. This does not read GPU sensors.
detect_games = true
# Game Mode while no game is in front. A detected game uses its own profile.
game_mode = false

# One block per detected game. The name is the one Lark shows (for example Hades).
# Uncomment to keep push-to-talk, Game Mode, and the overlays for that game.
# [games.Hades]
# ptt = true
# ptt_key = "backquote"
# game_mode = true
# voice_overlay = true
# perf_overlay = false
