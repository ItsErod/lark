<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lark Clip</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent !important; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font: 13px "Segoe UI", system-ui, sans-serif; user-select: none; }
      .toast { display: flex; align-items: center; gap: 8px; max-width: 244px; padding: 8px 12px; border-radius: 6px; background: #09090b; color: #fafafa; border: 1px solid #27272a; opacity: 0; transform: translateY(-4px); transition: opacity 120ms, transform 120ms; }
      .toast.on { opacity: 1; transform: none; }
      .toast.fail { color: #fca5a5; }
      .dot { width: 6px; height: 6px; border-radius: 3px; background: currentColor; flex: none; }
      .text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <div class="toast" id="toast"><span class="dot"></span><span class="text" id="text"></span></div>
    <script type="module" src="/src/clip-toast.ts"></script>
  </body>
</html>
