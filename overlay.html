<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lark Voice</title>
    <style>
      html, body, #hud {
        margin: 0;
        background: transparent !important;
        overflow: hidden;
        height: 100%;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #dbdee1;
        user-select: none;
      }
      .voice-hud {
        opacity: calc(var(--hud-opacity, 70) / 100);
        background: rgba(30, 31, 34, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 8px 8px 6px;
        box-sizing: border-box;
      }
      .voice-hud-bar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        min-height: 22px;
        cursor: grab;
      }
      .voice-hud-channel {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
      }
      .voice-hud-state { flex: none; font-size: 11px; font-weight: 700; color: #23a55a; letter-spacing: 0.02em; }
      .voice-hud-state.is-muted { color: #f23f43; }
      .voice-hud-meta { display: flex; gap: 8px; margin: 2px 4px 0; min-width: 0; font-size: 11px; font-weight: 650; color: #949ba4; }
      .voice-hud-link, .voice-hud-game { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .voice-hud-link { font-variant-numeric: tabular-nums; }
      .voice-hud-link.is-excellent, .voice-hud-link.is-good { color: #23a55a; }
      .voice-hud-link.is-fair { color: #f0b232; }
      .voice-hud-link.is-poor { color: #f23f43; }
      .voice-hud-people { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .voice-hud-person, .voice-hud-empty, .voice-hud-more {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        padding: 1px 4px;
        border-radius: 6px;
      }
      .voice-hud-empty, .voice-hud-more { color: #949ba4; font-size: 12px; }
      .voice-hud-avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-size: 10px;
        font-weight: 700;
        color: #fff;
        background: #5865f2;
      }
      .voice-hud-avatar img { width: 100%; height: 100%; object-fit: cover; }
      .voice-hud-person.is-speaking .voice-hud-avatar { box-shadow: 0 0 0 2px #23a55a; }
      .voice-hud-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 500;
      }
      .voice-hud-person.is-muted .voice-hud-name { color: #949ba4; }
      .voice-hud-flags { margin-left: auto; display: flex; gap: 4px; color: #f23f43; flex: none; }
      .voice-hud-flags svg { width: 14px; height: 14px; }
      .perf-hud {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 6px 4px 2px;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
      }
      .voice-hud-bar + .perf-hud { border-top: 0; padding-top: 0; }
      .perf-hud dt { color: #949ba4; font-weight: 600; }
      .perf-hud dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
